    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('sklp-theme');
          var isDark = savedTheme === 'dark' || (!savedTheme) || (savedTheme !== 'light');
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('sklp-language');
          if (savedLang && (savedLang === 'en' || savedLang === 'te' || savedLang === 'hi')) {
            document.documentElement.lang = savedLang;
          } else {
            document.documentElement.lang = 'en';
          }
        } catch (_e) { /* localStorage unavailable in sandboxed env */ }
      })();
    </script>
