# Render Infrastructure-as-Code Blueprint for SKLP Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sklp-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=optional
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
        # Set this in Render Dashboard > Environment
        # MongoDB Atlas: whitelist 0.0.0.0/0 in Network Access
      - key: PRODUCTION_ADMIN_EMAIL
        value: anjiduda77@gmail.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: FRONTEND_URL
        sync: false
        # Set to your Vercel URL e.g. https://sklp-fashion-ecommerce-platform.vercel.app
      - key: ADMIN_FRONTEND_URL
        sync: false
        # Set to same Vercel URL if no separate admin panel
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
        # Set this to validate Razorpay webhook signatures
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMS_PROVIDER
        value: "fast2sms"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: sklp-fashion-store-9fa5d
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
        # Paste full private key with \n newlines, wrap in double quotes in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ENABLE_AI_FEATURES
        value: "true"
      - key: ENABLE_CHATBOT
        value: "true"
      - key: ENABLE_RECOMMENDATIONS
        value: "true"
